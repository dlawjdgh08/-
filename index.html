<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Three.js AI 버스 번호 인식 시뮬레이션</title>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/examples/jsm/controls/PointerLockControls.js": "https://unpkg.com/three@0.160.0/examples/jsm/controls/PointerLockControls.js"
      }
    }
  </script>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #b9ddff;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    #app {
      position: fixed;
      inset: 0;
      overflow: hidden;
      background: linear-gradient(#b9ddff 0%, #d8ecff 45%, #92cf78 46%, #7bc56a 100%);
    }

    canvas { display: block; }

    .ui {
      position: fixed;
      inset: 0;
      pointer-events: none;
      color: white;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      padding: 14px;
      flex-wrap: wrap;
    }

    .panel {
      pointer-events: auto;
      background: rgba(10, 14, 26, 0.68);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 14px;
      backdrop-filter: blur(8px);
      box-shadow: 0 10px 28px rgba(0,0,0,0.22);
    }

    .info {
      max-width: 480px;
      padding: 12px 14px;
      line-height: 1.5;
    }

    .info h1 {
      margin: 0 0 6px;
      font-size: 18px;
      font-weight: 800;
    }

    .info p {
      margin: 0;
      font-size: 14px;
      color: #e7f1ff;
    }

    .status {
      min-width: 320px;
      padding: 12px 14px;
    }

    .status .row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin: 6px 0;
      font-size: 14px;
    }

    .status .label { color: #c2d3ee; }
    .status .value { font-weight: 700; color: #ffffff; }

    .assistant-card {
      position: fixed;
      left: 50%;
      bottom: 22px;
      transform: translateX(-50%);
      min-width: min(92vw, 680px);
      text-align: center;
      padding: 16px 18px;
      background: rgba(0, 0, 0, 0.76);
      border: 2px solid rgba(255,255,255,0.16);
      border-radius: 18px;
      pointer-events: none;
      box-shadow: 0 10px 26px rgba(0,0,0,0.28);
    }

    .assistant-card .title {
      font-size: 16px;
      color: #ffd479;
      font-weight: 800;
    }

    .assistant-card .reading {
      margin-top: 6px;
      font-size: clamp(34px, 5vw, 72px);
      font-weight: 900;
      color: #7cff9a;
      line-height: 1.05;
      text-shadow: 0 0 18px rgba(124,255,154,0.35);
    }

    .assistant-card .sub {
      margin-top: 8px;
      font-size: 13px;
      color: #d7e2ff;
      line-height: 1.45;
    }

    .center-help {
      position: fixed;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      color: rgba(255,255,255,0.65);
      text-align: center;
      font-size: 14px;
      pointer-events: none;
      user-select: none;
    }

    .crosshair {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.9);
      margin: 0 auto 10px;
      box-shadow: 0 0 10px rgba(255,255,255,0.2);
    }
  </style>
</head>
<body>
  <div id="app"></div>

  <div class="ui">
    <div class="topbar">
      <div class="panel info">
        <h1>Three.js AI 버스 번호 인식 시뮬레이션</h1>
        <p>
          시작 지점을 버스 번호를 보는 방향으로 맞춘 버전입니다.
        </p>
      </div>

      <div class="panel status">
        <div class="row"><span class="label">구성 요소</span><span class="value">scene / camera / light / object / control</span></div>
        <div class="row"><span class="label">이동</span><span class="value">W A S D</span></div>
        <div class="row"><span class="label">인식 방식</span><span class="value">AI Camera → Voice</span></div>
        <div class="row"><span class="label">상태</span><span class="value" id="stateText">버스를 기다리는 중</span></div>
      </div>
    </div>

    <div class="assistant-card">
      <div class="title">AI 안내 결과</div>
      <div class="reading" id="aiReading">버스 번호를 인식 중입니다</div>
      <div class="sub" id="voiceText">버스가 인식 구간에 들어오면 음성 안내가 재생됩니다.</div>
    </div>

    <div class="center-help">
      <div class="crosshair"></div>
      <div>화면 중앙 인식 구간</div>
    </div>
  </div>

  <script type="module">
    import * as THREE from "three";
    import { PointerLockControls } from "three/examples/jsm/controls/PointerLockControls.js";

    const app = document.getElementById("app");
    const stateText = document.getElementById("stateText");
    const aiReading = document.getElementById("aiReading");
    const voiceText = document.getElementById("voiceText");

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xb9ddff);
    scene.fog = new THREE.Fog(0xb9ddff, 12, 160);

    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 500);
    camera.position.set(0, 1.7, -18);
    camera.rotation.y = Math.PI;

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.35;
    app.appendChild(renderer.domElement);

    scene.add(new THREE.AmbientLight(0xffffff, 2.0));
    scene.add(new THREE.HemisphereLight(0xffffff, 0xbfe3ff, 2.6));
    const sun = new THREE.DirectionalLight(0xffffff, 4.8);
    sun.position.set(40, 70, 30);
    scene.add(sun);
    const fill = new THREE.DirectionalLight(0xddeeff, 1.8);
    fill.position.set(-30, 25, 20);
    scene.add(fill);

    const controls = new PointerLockControls(camera, document.body);
    scene.add(controls.getObject());
    document.body.addEventListener("click", () => controls.lock());

    function mat(color, roughness = 0.95, metalness = 0.02, emissive = 0x000000, emissiveIntensity = 0) {
      return new THREE.MeshStandardMaterial({ color, roughness, metalness, emissive, emissiveIntensity });
    }

    const ground = new THREE.Mesh(new THREE.PlaneGeometry(240, 240), mat(0x84d06f, 1));
    ground.rotation.x = -Math.PI / 2;
    scene.add(ground);

    const road = new THREE.Mesh(new THREE.PlaneGeometry(12, 180), mat(0x3a404d, 1));
    road.rotation.x = -Math.PI / 2;
    scene.add(road);

    for (let x of [-3, 3]) {
      const lane = new THREE.Mesh(new THREE.BoxGeometry(0.16, 0.02, 180), mat(0xf8f3a1, 0.9, 0.01, 0x222200, 0.08));
      lane.position.set(x, 0.01, 0);
      scene.add(lane);
    }

    for (let i = -5; i <= 5; i++) {
      const stripe = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.03, 2.2), mat(0xffffff, 0.9));
      stripe.position.set(i * 1.0, 0.015, 0);
      scene.add(stripe);
    }

    const busGroup = new THREE.Group();
    scene.add(busGroup);

    function createBus(number) {
      const group = new THREE.Group();
      const body = new THREE.Mesh(new THREE.BoxGeometry(3.5, 2.1, 7.2), mat(0xf6b21a, 0.72, 0.04));
      group.add(body);

      const front = new THREE.Mesh(new THREE.BoxGeometry(3.2, 1.8, 0.35), mat(0x0f172a, 0.95, 0));
      front.position.set(0, 0.15, 3.65);
      group.add(front);

      const plateCanvas = document.createElement("canvas");
      plateCanvas.width = 1024;
      plateCanvas.height = 256;
      const pctx = plateCanvas.getContext("2d");
      pctx.fillStyle = "#ffffff";
      pctx.fillRect(0, 0, 1024, 256);
      pctx.fillStyle = "#000000";
      pctx.fillRect(18, 18, 988, 220);
      pctx.fillStyle = "#7cff9a";
      pctx.font = "bold 160px sans-serif";
      pctx.textAlign = "center";
      pctx.textBaseline = "middle";
      pctx.fillText(number, 512, 128);

      const plateTex = new THREE.CanvasTexture(plateCanvas);
      plateTex.colorSpace = THREE.SRGBColorSpace;
      const plate = new THREE.Mesh(new THREE.PlaneGeometry(2.68, 0.74), new THREE.MeshBasicMaterial({ map: plateTex }));
      plate.position.set(0.95, 0.35, 3.89);
      plate.rotation.y = 0.18;
      group.add(plate);

      return group;
    }

    const busNumbers = ["362", "120", "740", "231", "55"];
    let busIndex = 0;
    let currentBus = createBus(busNumbers[busIndex]);
    busGroup.add(currentBus);

    const busState = { x: -30, z: 0, speed: 8.5, active: true };
    let announced = false;
    let spawnWait = 0;
    const clock = new THREE.Clock();

    const player = controls.getObject();
    player.position.set(0, 1.7, -18);
    player.rotation.y = Math.PI;

    const keys = { w: false, a: false, s: false, d: false };

    function speak(text) {
      voiceText.textContent = text;
      if ("speechSynthesis" in window) {
        window.speechSynthesis.cancel();
        const utter = new SpeechSynthesisUtterance(text);
        utter.lang = "ko-KR";
        window.speechSynthesis.speak(utter);
      }
    }

    function nextBus() {
      busGroup.remove(currentBus);
      busIndex = (busIndex + 1) % busNumbers.length;
      currentBus = createBus(busNumbers[busIndex]);
      busGroup.add(currentBus);
      busState.x = -30;
      busState.active = true;
      announced = false;
      aiReading.textContent = "버스 번호를 인식 중입니다";
      stateText.textContent = "새 버스 등장";
    }

    function updateBus(dt) {
      if (busState.active) {
        busState.x += busState.speed * dt;
        currentBus.position.set(busState.x, 1.15, busState.z);
        currentBus.rotation.y = Math.PI;

        const inZone = busState.x > -1.8 && busState.x < 1.8;
        if (inZone) {
          aiReading.textContent = `인식 결과: 버스 ${busNumbers[busIndex]}번`;
          stateText.textContent = "버스 번호 인식 중";
          if (!announced) {
            announced = true;
            speak(`버스 번호 ${busNumbers[busIndex]}번입니다.`);
          }
        } else if (busState.x < -1.8) {
          aiReading.textContent = "버스 번호를 인식 중입니다";
          stateText.textContent = "버스 접근 중";
        } else {
          aiReading.textContent = "버스 번호를 인식 중입니다";
          stateText.textContent = "버스 통과 중";
        }

        if (busState.x > 32) {
          busState.active = false;
          spawnWait = 3 + Math.random() * 3;
          stateText.textContent = "다음 버스 대기";
        }
      } else {
        spawnWait -= dt;
        if (spawnWait <= 0) nextBus();
      }
    }

    function animate() {
      requestAnimationFrame(animate);
      const dt = Math.min(clock.getDelta(), 0.05);

      if (keys.w) player.translateZ(-4.5 * dt);
      if (keys.s) player.translateZ(4.5 * dt);
      if (keys.a) player.translateX(-4.5 * dt);
      if (keys.d) player.translateX(4.5 * dt);

      player.position.x = THREE.MathUtils.clamp(player.position.x, -18, 18);
      player.position.z = THREE.MathUtils.clamp(player.position.z, -45, 45);

      updateBus(dt);
      renderer.render(scene, camera);
    }

    window.addEventListener("keydown", (e) => {
      if (e.code === "KeyW") keys.w = true;
      if (e.code === "KeyA") keys.a = true;
      if (e.code === "KeyS") keys.s = true;
      if (e.code === "KeyD") keys.d = true;
    });

    window.addEventListener("keyup", (e) => {
      if (e.code === "KeyW") keys.w = false;
      if (e.code === "KeyA") keys.a = false;
      if (e.code === "KeyS") keys.s = false;
      if (e.code === "KeyD") keys.d = false;
    });

    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    });

    animate();
  </script>
</body>
</html>
